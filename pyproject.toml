[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-knowledge-engine"
version = "0.1.0"
description = "Privacy-first, evidence-grounded professional knowledge engine"
requires-python = ">=3.11"
dependencies = ["ijson>=3.2,<5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pke = "pke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
